name: iOS bug
description: Report a problem with Fjord Mobile on iPhone or iPad.
labels: ["ios", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        **This issue will be public.** Before you submit, remove access tokens, passwords, private server URLs, private repository names, and personal data from everything you type, paste, or attach. That includes screenshots.

        Security problems do not belong here. See the [security policy](https://github.com/rasterandstate/fjord/security/policy).
  - type: input
    id: app-version
    attributes:
      label: Fjord Mobile version
      description: For example 1.3.0.
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: iOS or iPadOS version
      description: For example iOS 18.2.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: For example iPhone 16 Pro or iPad Air (M2).
    validations:
      required: true
  - type: dropdown
    id: forge-type
    attributes:
      label: Forge
      description: The kind of server Fjord was connected to. Choose "Not applicable" if the problem has nothing to do with a server, such as installing or purchasing.
      options:
        - Forgejo
        - Gitea
        - Other compatible forge
        - Not applicable
        - Not sure
    validations:
      required: true
  - type: input
    id: forge-version
    attributes:
      label: Forge version
      description: Optional. Leave it blank if you do not know. Please do not guess.
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, one step per line.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Screenshots help. Check them for tokens, private URLs, and private repository names first.
    validations:
      required: true
